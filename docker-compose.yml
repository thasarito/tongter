services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Published on the risklab_default bridge gateway rather than 0.0.0.0, so
    # the app is reachable from the Caddy container (and the host) but not from
    # the public internet — everything from outside must come through Caddy on
    # 443. This mirrors how poc.thasarito.com and paperclip.thasarito.com are
    # already wired in that Caddyfile.
    #
    # If the risklab compose project is ever recreated with a different subnet,
    # update this address to the new `docker network inspect risklab_default`
    # gateway.
    ports:
      - "172.23.0.1:3200:3000"
    volumes:
      - ./secrets/google-service-account.json:/app/secrets/google-service-account.json:ro
