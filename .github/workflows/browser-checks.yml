name: Browser checks (manual)

# Deliberately not part of pull-request verification or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright builds and serves the app locally using CLOUDFLARE_ENV=test.
      - run: pnpm test:e2e
        timeout-minutes: 10
      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-previews-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
