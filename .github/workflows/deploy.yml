name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - name: Bundle private sheet writer
        run: pnpm exec wrangler deploy --config wrangler.studio-writer.jsonc --dry-run --outdir /tmp/studio-writer-build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep synthetic studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-previews-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    env:
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy internal sheet coordinator
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.studio-writer.jsonc
      - run: pnpm build
      - name: Enable Cloudflare preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"enabled":false,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/warissara-wedding/subdomain" \
            --output /dev/null
      - name: Upload Cloudflare preview
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - name: Find preview URL
        id: preview-url
        env:
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          url="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Version Preview Alias URL: \(https:\/\/[^[:space:]]*\).*/\1/p' | tail -n 1)"
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Verify preview
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 "$PREVIEW_URL/" --output /dev/null
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 "$PREVIEW_URL/api/health" | jq --exit-status '.ok == true'
      - name: Install browser for live sheet verification
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify live studio and read-only writer probe
        timeout-minutes: 6
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          STUDIO_PREVIEW_PASSPHRASE: ${{ secrets.STUDIO_PREVIEW_PASSPHRASE }}
        run: pnpm exec node --experimental-strip-types scripts/check-live-studio.mts
      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\nCloudflare preview: ${process.env.PREVIEW_URL}\n\nDesktop/mobile live-sheet readback and the read-only writer probe passed. No live guest placements were changed by verification.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy internal sheet coordinator
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.studio-writer.jsonc
      - run: pnpm build
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Report missing deploy token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Verification passed; add CLOUDFLARE_API_TOKEN to enable automatic deploys."
